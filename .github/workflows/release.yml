name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version and release notes
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s "docs/releases/$version.md"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Run offline tests
        run: ./scripts/test.sh
      - name: Build and verify release ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ./scripts/package-release.sh "$GITHUB_REF_NAME"
          else
            ./scripts/package-release.sh
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-meter-${{ github.sha }}
          path: |
            .build/release/*.zip
            .build/release/SHA256SUMS.txt
            .build/release/release-notes.md
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-meter-${{ github.sha }}
          path: release
      - name: Stage verified assets for local signing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          # A draft keeps partial uploads out of the published release. A retry
          # can repair a draft, but must never replace an already published asset.
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > is-draft.txt 2>/dev/null; then
            test "$(cat is-draft.txt)" = true || {
              echo 'This version is already published. Use a new version.' >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS.txt \
              --verify-tag --draft --title "Codex Meter ${RELEASE_TAG#v}" \
              --notes-file release-notes.md
          fi
          # Maintainer runs scripts/publish-release.sh to sign and publish.
          # No signing private key is stored in GitHub Actions.
          gh release view "$RELEASE_TAG" --json url --jq .url
